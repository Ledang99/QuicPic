name: Android CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Cache Android SDK and apktool
        uses: actions/cache@v4
        with:
          path: |
            ~/android-sdk
            ~/tools
          key: ${{ runner.os }}-apktool-sdk-34.0.0

      - name: Install build tools
        run: ./scripts/setup-tools.sh

      - name: Build APK
        run: ./build.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuicPic-stable-apk
          path: releases/stable.apk
          if-no-files-found: error
